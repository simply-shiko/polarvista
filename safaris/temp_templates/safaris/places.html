{% extends 'safaris/base.html' %}

{% block content %}
<div class="text-center mb-4">
    <h1 class="fw-bold">All Places</h1>
    <p class="text-muted">Explore all destinations and locations we offer.</p>
</div>

<div class="row">
    {% for place in places %}
    <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
            <div class="card-body">
                <h5 class="card-title">{{ place.name }}</h5>
                <p class="text-muted">Destination: {{ place.destination.name }}</p>
            </div>
        </div>
    </div>
    {% empty %}
    <p class="text-center">No places available.</p>
    {% endfor %}
</div>
{% endblock %}
